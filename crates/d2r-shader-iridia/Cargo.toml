[package]
name = "d2r-shader-iridia"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Kept outside the ordinary workspace; consumed as a path dependency.
# Build it through a workspace that applies the patched crates ([patch.crates-io]);
# standalone builds lack those patches.
[workspace]

[features]
default = []
# Consumers enabling production admission require an externally authenticated
# actual Cargo graph. Standalone diagnostic tools remain explicitly qualified.
require-consumed-build = []

[dependencies]
iridia = "=0.5.0"
iridia-dxbc = "=0.5.0"
iridia_naga = { package = "primase-naga", version = "=30.0.1", features = ["wgsl-in", "spv-in", "spv-out"] }
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-in", "spv-out"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[build-dependencies]
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
proc-macro2 = "=1.0.107"
syn = "=2.0.119"

[profile.dev]
debug = 0
